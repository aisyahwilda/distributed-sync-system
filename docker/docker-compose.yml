services:
  node1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    container_name: node1
    ports:
      - "8001:8000"
    environment:
      - NODE_ID=node1
      - PORT=8000
      - PEERS=node2,node3
      - CACHE_SIZE=100
      - REPLICATION_FACTOR=2
      - LOG_LEVEL=INFO
    networks:
      - distnet
    volumes:
      - node1_data:/app/data
      - ../src:/app/src
      - ../requirements.txt:/app/requirements.txt
    restart: on-failure

  node2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    container_name: node2
    ports:
      - "8002:8000"
    environment:
      - NODE_ID=node2
      - PORT=8000
      - PEERS=node1,node3
      - CACHE_SIZE=100
      - REPLICATION_FACTOR=2
      - LOG_LEVEL=INFO
    networks:
      - distnet
    volumes:
      - node2_data:/app/data
      - ../src:/app/src
      - ../requirements.txt:/app/requirements.txt
    restart: on-failure
    depends_on:
      - node1

  node3:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    container_name: node3
    ports:
      - "8003:8000"
    environment:
      - NODE_ID=node3
      - PORT=8000
      - PEERS=node1,node2
      - CACHE_SIZE=100
      - REPLICATION_FACTOR=2
      - LOG_LEVEL=INFO
    networks:
      - distnet
    volumes:
      - node3_data:/app/data
      - ../src:/app/src
      - ../requirements.txt:/app/requirements.txt
    restart: on-failure
    depends_on:
      - node1

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - distnet
    restart: unless-stopped
    depends_on:
      - node1
      - node2
      - node3

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ADMIN_USER=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - distnet
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  node1_data:
  node2_data:
  node3_data:
  prometheus_data:
  grafana_data:

networks:
  distnet:
    driver: bridge
